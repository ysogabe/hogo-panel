<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hogo Panel — 投薬を思い出す画面</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--foreground,#e4e7e2);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #aac2ed;outline-offset:4px}
.scenes{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}.scenes button{background:var(--card,#252c27);color:inherit;border:1px solid var(--border,#485047);border-radius:9px;padding:8px 13px;font-size:13px}.scenes .active{background:#e5cc87;color:#30291a;border-color:#e5cc87}
.frame{position:relative;width:100%;overflow:hidden;border-radius:18px;background:#181e1b}.device{position:absolute;top:0;left:0;width:960px;height:480px;transform-origin:top left;overflow:hidden;background:#181e1b;color:#eef0e9}
header{height:76px;padding:0 26px;display:flex;align-items:center;justify-content:space-between}.identity{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:600;color:#c9d0c3}.identity svg{width:28px;height:28px;stroke:#b5c1ac}.headright{display:flex;align-items:center;gap:22px}.time{font-size:26px;font-variant-numeric:tabular-nums;color:#a9b1a2}.clockbutton{border:0;background:transparent;color:#949f8b;border-radius:50%;height:60px;width:60px;display:grid;place-items:center}.clockbutton svg{width:27px;height:27px}
.device.attention{background:#25231b}main{height:404px;padding:16px 24px 24px;display:grid;grid-template-columns:560px 336px;gap:16px}main.everyday{grid-template-columns:1fr}.everyday .carelist{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr}.everyday .care{position:relative;flex-direction:column;align-items:center;justify-content:center;text-align:center}.everyday .care strong{font-size:34px}.everyday .care small{font-size:42px;margin-top:20px}.everyday .care .plus{position:absolute;right:26px;bottom:22px;font-size:32px}.meds.one{grid-template-rows:1fr}.meds{display:grid;grid-template-rows:1fr 1fr;gap:16px;min-height:0}.med{width:100%;border:1px solid #3b443a;border-radius:20px;background:#242c25;color:#c0c9b8;display:grid;grid-template-columns:64px 1fr 36px;align-items:center;gap:20px;padding:24px;text-align:left}.med .icon{width:64px;height:64px;background:#343f32;border-radius:20px;display:grid;place-items:center;color:#929f85}.med svg{width:33px;height:33px}.med strong{display:block;font-size:38px;font-weight:600;letter-spacing:.01em;white-space:nowrap}.med .state{display:block;font-size:24px;margin-top:8px;min-height:30px;color:#9aab8d}.med .mark{font-size:30px;text-align:center;color:#66775f}
.med.soon{background:#393326;border-color:#a18b52;color:#f5ecd5}.med.soon .icon{background:#574b2d;color:#e9cf85}.med.soon .state,.med.soon .mark{color:#e8cc82}.med.today{background:#473524;border-color:#c49b53;color:#fff0d4}.med.today .icon{background:#685032;color:#f3d399}.med.today .state,.med.today .mark{color:#f4d08b}.med.late{background:#422d28;border-color:#b67866;color:#f4ded3}.med.late .icon{background:#634238;color:#edbaa4}.med.late .state,.med.late .mark{color:#ecb49e}.med.done{background:#222a24;border-color:#344333;color:#94a58d}.med.done .icon{background:#2d3c2e;color:#96b88b}.med.done .mark{color:#a4c495}.med.done .state{color:#91a486}
@keyframes pulse-today{50%{background:#342b1f;border-color:#7c653a}}@keyframes pulse-late{50%{background:#322721;border-color:#755244}}.med.today.pulse{animation:pulse-today 2.4s ease-in-out infinite}.med.late.pulse{animation:pulse-late 2.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.med.pulse{animation:none}}
.carelist{display:grid;grid-template-rows:repeat(3,1fr);gap:12px;min-height:0}.care{border:1px solid #354034;border-radius:18px;background:#212a23;color:#d2ddcb;padding:18px 22px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px}.care strong{font-size:27px;display:block;font-weight:500}.care small{font-size:20px;display:block;color:#92a28a;margin-top:5px}.care .plus{font-size:29px;color:#718a67}
.scrim{position:absolute;inset:0;background:#070c09d9;display:grid;place-items:center;z-index:5;padding:20px}.dialog{width:580px;background:#29332b;border:1px solid #56634f;border-radius:24px;padding:32px;text-align:center}.dialog .symbol{width:64px;height:64px;color:#e3cd91;margin:0 auto 20px}.dialog h1{font-size:38px;font-weight:600;margin:0 0 32px}.actions{display:flex;gap:14px}.actions button{height:78px;flex:1;border:1px solid #4a5a43;border-radius:14px;background:#344231;color:#c6d3be;font-size:25px}.actions button:disabled{opacity:.48;cursor:default}.actions .primary{background:#d4dda9;color:#28371e;border-color:#d4dda9;font-weight:600}
.toast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#d9e6c8;color:#2d3b22;border-radius:14px;padding:8px 18px;display:flex;align-items:center;gap:25px;min-width:520px;min-height:76px;justify-content:space-between;z-index:6;font-size:20px;box-shadow:0 5px 25px #0003;white-space:nowrap}.toast button{border:0;background:transparent;color:#354e29;min-width:72px;min-height:60px;font-size:20px;text-decoration:underline}
.clock{position:absolute;inset:0;background:#050605;z-index:10;display:flex;align-items:center;justify-content:center;cursor:pointer}.digits{display:flex;align-items:center;gap:9px;opacity:.53;transform:translateY(-18px)}.digit{background:linear-gradient(#1d201b 49.6%,#080b08 49.6%,#080b08 50.4%,#191e17 50.4%);width:140px;height:216px;border-radius:14px;display:grid;place-items:center;font-size:174px;line-height:1;font-weight:650;color:#939d89;font-variant-numeric:tabular-nums}.colon{width:30px;font-size:104px;color:#7f8c74;text-align:center}.clockflags{position:absolute;bottom:47px;display:flex;gap:18px;color:#d9c17e;font-size:23px}.clockflags span{border:1px solid #786638;border-radius:11px;padding:9px 18px;background:#2d2818}.caption{font-size:12px;color:var(--muted-foreground,#9aab92);margin:10px 0 0}
</style>
</head>
<body>
<div class="scenes" aria-label="画面の状態を切り替える">
<button data-scene="normal" onclick="scene('normal')">普段</button><button data-scene="soon" onclick="scene('soon')">2日前</button><button data-scene="today" onclick="scene('today')">当日</button><button data-scene="late" onclick="scene('late')">過ぎたら</button><button data-scene="done" onclick="scene('done')">実施後</button><button data-scene="clock" onclick="scene('clock')">時計</button>
</div>
<div class="frame" id="frame"><div class="device" id="device" aria-label="960×480の画面案"></div></div>
<p class="caption">架空データ・各薬1回分・時刻固定。再読込で初期化。</p>
<script>
const icons={
 pill:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M17 8a11 11 0 0 1 16 16L19 38A11 11 0 0 1 3 22Z" transform="translate(6 -1)"/><path d="m17 17 15 15"/></svg>',
 drop:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M24 5S10 22 10 30a14 14 0 0 0 28 0C38 22 24 5 24 5Z"/><path d="M17 29a7 7 0 0 0 7 8"/></svg>',
 cat:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 14 4 4l9 6h6l9-6-1 10c3 13-25 13-22 0Z"/><path d="M11 17h.1M21 17h.1M14 22h4" stroke-linecap="round"/></svg>',
 clock:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="16" cy="16" r="11"/><path d="M16 9v8l5 3"/></svg>'
};
const seed=[{id:'filaria-20261020',name:'フィラリア',icon:'pill',due:'2026-10-20'},{id:'frontline-20261020',name:'フロントライン',icon:'drop',due:'2026-10-20'}];
const careSeed=[{name:'ごはん',elapsed:'2時間前'},{name:'トイレ',elapsed:'50分前'},{name:'目薬',elapsed:'2時間前'}];
let meds,cares,today='2026-10-17',currentScene='normal',modal=null,clock=false,notice=null,undo=null,toastTimer=null,modalTimer=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dayNumber(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/86400000}
function phase(m){if(m.done)return 'done';const days=dayNumber(m.due)-dayNumber(today);return days>2?'normal':days>0?'soon':days===0?'today':'late'}
function pulses(m){return !modal&&['today','late'].includes(phase(m))}
function label(m){return {normal:'',soon:'そろそろ',today:'今日',late:'未確認',done:'済'}[phase(m)]}
function clearToast(){clearTimeout(toastTimer);notice=null;undo=null}
function scene(s){if(s==='clock'){enterClock();return}clearModal();clearToast();currentScene=s;modal=null;clock=false;today={normal:'2026-10-17',soon:'2026-10-18',today:'2026-10-20',late:'2026-10-21',done:'2026-10-20',clock:'2026-10-18'}[s];meds=seed.map(m=>({...m,done:s==='done'}));cares=careSeed.map(c=>({...c}));render()}
function clearModal(){clearTimeout(modalTimer);modalTimer=null;modal=null}
function openConfirmation(selection){clearModal();clearToast();const opened={...selection,unlockAt:performance.now()+450};modal=opened;render();document.querySelector('.dialog .back')?.focus();modalTimer=setTimeout(()=>{if(modal===opened){const button=document.querySelector('.dialog .decision');if(button)button.disabled=false}},450)}
function openMed(id){const m=meds.find(m=>m.id===id);if(m&&['soon','today','late'].includes(phase(m)))openConfirmation({kind:'med',id})}
function openCare(i){openConfirmation({kind:'care',i})}
function closeModal(){clearModal();render()}
function feedback(text,action=null){clearToast();notice=text;undo=action;toastTimer=setTimeout(()=>{clearToast();render()},8000);render()}
function confirm(){if(!modal||performance.now()<modal.unlockAt)return;const selected=modal;clearModal();if(selected.kind==='med'){const m=meds.find(m=>m.id===selected.id),before=m.done;if(before){feedback(m.name+' は記録済み');return}m.done=true;feedback(m.name+' 記録しました',()=>{m.done=before})}else{const c=cares[selected.i],before=c.elapsed;c.elapsed='たった今';feedback(c.name+' 記録しました',()=>{c.elapsed=before})}}
function undoLast(){const action=undo;clearToast();if(action)action();feedback('取り消しました')}
function enterClock(){clearModal();clearToast();clock=true;render()}
function wake(){clock=false;render()}
function dialog(){if(!modal)return '';const m=modal.kind==='med'?meds.find(m=>m.id===modal.id):null;const name=m?m.name:cares[modal.i].name;return `<div class="scrim" onclick="closeModal()"><section class="dialog" role="dialog" aria-modal="true" aria-label="${esc(name)}の実施確認" onclick="event.stopPropagation()">${m?'<div class="symbol">'+icons[m.icon]+'</div>':''}<h1>${esc(name)}</h1><div class="actions"><button class="back" onclick="closeModal()">戻る</button><button class="decision primary" ${performance.now()<modal.unlockAt?'disabled':''} onclick="confirm()">やった</button></div></section></div>`}
function render(){
 const warnings=meds.filter(m=>['soon','today','late'].includes(phase(m)));
 document.getElementById('device').classList.toggle('attention',warnings.length>0);
 document.getElementById('device').innerHTML=`<header><div class="identity">${icons.cat}こむぎ</div><div class="headright"><span class="time">10:30</span><button class="clockbutton" aria-label="時計を表示" title="時計" onclick="enterClock()">${icons.clock}</button></div></header><main class="${warnings.length?'with-reminder':'everyday'}">${warnings.length?`<section class="meds ${warnings.length===1?'one':''}" aria-label="月1回のお世話">${warnings.map(m=>`<button class="med ${phase(m)}${pulses(m)?' pulse':''}"${pulses(m)?` style="animation-delay:-${Math.round(performance.now()%2400)}ms"`:''} onclick="openMed('${m.id}')" aria-label="${esc(m.name)}${label(m)?' '+label(m):''}"><span class="icon">${icons[m.icon]}</span><span><strong>${esc(m.name)}</strong><span class="state">${label(m)}</span></span><span class="mark">${m.done?'✓':phase(m)==='normal'?'':'●'}</span></button>`).join('')}</section>`:''}<aside class="carelist" aria-label="hogo-meterの日々のお世話">${cares.map((c,i)=>`<button class="care" onclick="openCare(${i})"><span><strong>${esc(c.name)}</strong><small>${esc(c.elapsed)}</small></span><span class="plus">＋</span></button>`).join('')}</aside></main>${dialog()}${notice?`<div class="toast" role="status"><span>${esc(notice)}</span>${undo?'<button onclick="undoLast()">取消</button>':''}</div>`:''}${clock?`<div class="clock" role="button" tabindex="0" aria-label="タッチして戻る" onclick="wake()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();wake()}"><div class="digits"><span class="digit">1</span><span class="digit">0</span><span class="colon">:</span><span class="digit">3</span><span class="digit">0</span></div>${warnings.length?`<div class="clockflags">${warnings.map(m=>`<span>${esc(m.name)}</span>`).join('')}</div>`:''}</div>`:''}`;
 document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===(clock?'clock':currentScene)));
}
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal();if(e.key==='Tab'&&modal){const buttons=[...document.querySelectorAll('.dialog button:not(:disabled)')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus()}}});
new ResizeObserver(e=>{const width=e[0].contentRect.width;document.getElementById('device').style.transform=`scale(${width/960})`;document.getElementById('frame').style.height=(480*width/960)+'px'}).observe(document.getElementById('frame'));
scene('normal');console.log('Hogo Panel minimal mock ready; synthetic data only.');
</script>
</body></html>
